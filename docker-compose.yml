services:
  api:
    build: .
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
    volumes: ["./data:/app/data", "./outputs:/app/outputs"]
  worker:
    build: .
    command: python -m apps.worker.main
    env_file: .env
    depends_on: [postgres, redis]
    volumes: ["./data:/app/data", "./outputs:/app/outputs"]
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: adforge, POSTGRES_PASSWORD: adforge, POSTGRES_DB: adforge}
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ["9001:9001"]
    volumes: ["miniodata:/data"]
volumes: {pgdata: {}, miniodata: {}}
